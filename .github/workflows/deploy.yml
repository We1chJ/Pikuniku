name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # These are NEXT_PUBLIC_*, so Next inlines them into the JavaScript
          # bundle that this workflow then publishes. They are readable by anyone
          # who opens the site either way — putting them in Actions secrets would
          # hide them from the repo but not from the deployed page. The
          # publishable key is designed for exactly this; row-level security is
          # what actually protects the data.
          NEXT_PUBLIC_SUPABASE_URL: https://tnrbpljquhvwrbrpvaqa.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OGfmnsf4wqzrh8w6byQefw_psN_l9IS

      # enablement turns Pages on via the API if it isn't already, so the repo
      # needs no manual setup. Without it this step fails with "Get Pages site
      # failed" until someone flips the switch in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
